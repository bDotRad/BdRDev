# nginx reverse proxy for the BdRDev dashboard (127.0.0.1:8420).
#
# Two TLS front doors, split by SNI (see ../tls/README.md):
#
#   * bdrpisrvdev.tail0ed3f6.ts.net   -> Let's Encrypt cert from
#     `tailscale cert` (../tls/gen-ts-cert.sh). Trusted everywhere with
#     no per-device setup. Reachable over the tailnet only.
#
#   * bdrpisrvdev.local / bdrdev.local / LAN IPs (default vhost)
#     -> leaf cert signed by the BdR Fleet Local Root CA
#     (../tls/gen-cert.sh). Trusted once you install that CA on the
#     device; works on the LAN and offline.
#
# Install:
#   sudo cp /home/bdr/projects/BdRDev/nginx/bdrdev.conf /etc/nginx/sites-available/bdrdev
#   sudo ln -sf /etc/nginx/sites-available/bdrdev /etc/nginx/sites-enabled/bdrdev
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bdrpisrvdev.local bdrpisrvdev bdrdev.local BdRDev
                bdrsrvdev.local BdRSrvDev bdrpisrvdev.tail0ed3f6.ts.net;
    return 301 https://$host$request_uri;
}

# --- Tailscale front door: Let's Encrypt cert -----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bdrpisrvdev.tail0ed3f6.ts.net;

    ssl_certificate     /home/bdr/projects/BdRDev/tls/bdrpisrvdev.tail0ed3f6.ts.net.crt;
    ssl_certificate_key /home/bdr/projects/BdRDev/tls/bdrpisrvdev.tail0ed3f6.ts.net.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- LAN / mDNS / IP: local-CA leaf (also the default vhost) -------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name bdrpisrvdev.local bdrpisrvdev bdrdev.local BdRDev
                bdrsrvdev.local BdRSrvDev localhost _;

    ssl_certificate     /home/bdr/projects/BdRDev/tls/bdrdev.local.crt;
    ssl_certificate_key /home/bdr/projects/BdRDev/tls/bdrdev.local.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
