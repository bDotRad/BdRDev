# srvhome route — the AMI box's front door.
#
# srvhome owns `/` on the AMI box (hostname now BdRPiSrvAMI / tailnet
# node bdrpisrvami; the nginx site file is still named `bdrpiami`). Supabase
# no longer lives at `/` — it moved to its own Tailscale-served port
# (`tailscale serve --https 8000 http://127.0.0.1:8000`, mirroring the
# dev box), so it no longer needs a location block in this file at all.
#
# Replace the OLD `location / { proxy_pass http://127.0.0.1:8000; }`
# (Supabase) and the OLD `location /status/ { ... }` block (srvhome
# under a sub-path) in `/etc/nginx/sites-available/bdrpiami`'s
# `listen 443 ssl` server block with just this:

location / {
    proxy_pass http://127.0.0.1:8610/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No auth_basic on this block — same trust model as the dev box
# dashboard (tailnet + LAN-bound nginx is the boundary), decided in
# `_Requests/_Archive/*_rAMIWebLayout.md`. If an auth_basic directive is
# inherited from the surrounding server block, add `auth_basic off;`
# here too so it doesn't leak onto srvhome.
#
# Then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Result: https://bdrpisrvami.local/  ->  srvhome on 127.0.0.1:8610
#         https://bdrpisrvami.tail0ed3f6.ts.net/  ->  same, over the tailnet
#         (also rename the site file bdrpiami -> bdrpisrvami and update its
#          server_name lines while you're in there)
#         Supabase moves to :8000 (see tailscale serve command above).
